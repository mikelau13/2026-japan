<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本之旅 2026 - 互動地圖</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            height: calc(100vh - 40px);
        }

        .header {
            grid-column: 1 / -1;
            text-align: center;
            color: white;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 1em;
            border: 2px solid white;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateX(-5px);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            height: calc(100vh - 150px);
        }

        /* 地圖面板 */
        .map-panel {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        #map {
            width: 100%;
            height: 100%;
            border-radius: 12px;
        }

        /* 行程列表面板 */
        .itinerary-panel {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .itinerary-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            font-size: 1.2em;
            font-weight: bold;
        }

        .itinerary-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .day-group {
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .day-title {
            font-weight: bold;
            font-size: 1.1em;
            color: #333;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .day-badge {
            background: #667eea;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            min-width: 60px;
            text-align: center;
        }

        .location-item {
            background: #f9f9f9;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .location-item:hover {
            background: #f0f0f0;
            border-left-color: #667eea;
            transform: translateX(5px);
        }

        .location-item.active {
            background: #667eea;
            color: white;
            border-left-color: #764ba2;
        }

        .location-item-time {
            font-size: 0.85em;
            opacity: 0.7;
            margin-bottom: 3px;
        }

        .location-item-name {
            font-weight: bold;
            margin-bottom: 3px;
        }

        .location-item-desc {
            font-size: 0.85em;
            line-height: 1.4;
            opacity: 0.8;
        }

        .location-item.active .location-item-time,
        .location-item.active .location-item-desc {
            opacity: 0.9;
        }

        /* 景點類型顏色 */
        .type-attraction { border-top-color: #FF6B6B; }
        .type-hotel { border-top-color: #4ECDC4; }
        .type-temple { border-top-color: #F5B041; }
        .type-cafe { border-top-color: #A569BD; }
        .type-museum { border-top-color: #52B788; }
        .type-garden { border-top-color: #74C69D; }
        .type-castle { border-top-color: #B4A7D6; }
        .type-festival { border-top-color: #F4978E; }
        .type-event { border-top-color: #FF85A1; }
        .type-landmark { border-top-color: #80CAFF; }
        .type-shop { border-top-color: #FFCC80; }
        .type-area { border-top-color: #C4A0FF; }
        .type-airport { border-top-color: #90EE90; }
        .type-experience { border-top-color: #FFB6C1; }
        .type-theater { border-top-color: #DDA0DD; }

        /* 圖例 */
        .legend {
            padding: 15px;
            background: #f5f5f5;
            border-top: 1px solid #ddd;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            font-size: 0.85em;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        /* Popup 樣式 */
        .leaflet-popup-content-wrapper {
            border-radius: 8px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.15);
        }

        .leaflet-popup-content {
            margin: 0;
            font-size: 0.95em;
        }

        .popup-title {
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }

        .popup-content {
            color: #666;
            line-height: 1.5;
        }

        /* 響應式設計 */
        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
                height: auto;
            }

            .map-panel {
                height: 400px;
            }

            .itinerary-panel {
                height: 500px;
            }
        }

        /* 篩選器 */
        .filter-controls {
            padding: 15px;
            background: #f9f9f9;
            border-bottom: 1px solid #ddd;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .filter-label {
            font-weight: bold;
            font-size: 0.9em;
        }

        .filter-select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.9em;
            cursor: pointer;
            background: white;
        }

        .filter-select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
        }

        /* 滾動條樣式 */
        .itinerary-list::-webkit-scrollbar {
            width: 8px;
        }

        .itinerary-list::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .itinerary-list::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 4px;
        }

        .itinerary-list::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="header">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h1 style="margin: 0;">🗺️ 日本之旅 2026 - 互動地圖</h1>
            <a href="../" class="back-btn" title="返回到主頁">← 返回主頁</a>
        </div>
        <p>2026年6月26日 ~ 7月6日 | 11天行程導覽</p>
    </div>

    <div class="container">
        <div class="map-panel">
            <div id="map"></div>
        </div>

        <div class="itinerary-panel">
            <div class="filter-controls">
                <label class="filter-label">篩選日期：</label>
                <select id="dayFilter" class="filter-select">
                    <option value="">全部行程</option>
                </select>
            </div>

            <div class="itinerary-header">
                行程清單 - 點擊景點即時定位地圖
            </div>

            <div class="itinerary-list" id="itinerary"></div>

            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color" style="background: #FF6B6B;"></div>
                    <span>景點</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #4ECDC4;"></div>
                    <span>住宿</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #F5B041;"></div>
                    <span>寺廟</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #FF85A1;"></div>
                    <span>活動</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #90EE90;"></div>
                    <span>機場</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        let map;
        let markers = {};
        let allData = {};
        let currentMarkers = [];

        // 顏色對應
        const typeColors = {
            'attraction': '#FF6B6B',
            'hotel': '#4ECDC4',
            'temple': '#F5B041',
            'cafe': '#A569BD',
            'museum': '#52B788',
            'garden': '#74C69D',
            'castle': '#B4A7D6',
            'festival': '#F4978E',
            'event': '#FF85A1',
            'landmark': '#80CAFF',
            'shop': '#FFCC80',
            'area': '#C4A0FF',
            'airport': '#90EE90',
            'experience': '#FFB6C1',
            'theater': '#DDA0DD'
        };

        // 初始化地圖
        function initMap() {
            map = L.map('map').setView([37.5, 138.5], 7);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 18,
                minZoom: 6
            }).addTo(map);
        }

        // 加載數據
        async function loadData() {
            const response = await fetch('data.json?v=2.41');
            const data = await response.json();
            allData = data;

            // 填充日期篩選器
            const dayFilter = document.getElementById('dayFilter');
            data.days.forEach(day => {
                const option = document.createElement('option');
                option.value = day.date;
                const formattedDate = formatDateWithWeekday(day.date);
                option.textContent = `${formattedDate} - ${day.title}`;
                dayFilter.appendChild(option);
            });

            // 渲染行程
            renderItinerary(data.days);

            // 添加所有標記
            addAllMarkers(data.days);
        }

        // 格式化日期為 MM/DD (weekday) 格式
        function formatDateWithWeekday(dateStr) {
            const date = new Date(dateStr + 'T00:00:00');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const weekday = weekdays[date.getDay()];
            return `${month}/${day} (${weekday})`;
        }

        // 渲染行程列表
        function renderItinerary(days, filterDate = '') {
            const itinerary = document.getElementById('itinerary');
            itinerary.innerHTML = '';

            const filteredDays = filterDate
                ? days.filter(d => d.date === filterDate)
                : days;

            filteredDays.forEach(day => {
                const dayGroup = document.createElement('div');
                dayGroup.className = 'day-group';

                const dayTitle = document.createElement('div');
                dayTitle.className = 'day-title';
                const formattedDate = formatDateWithWeekday(day.date);
                dayTitle.innerHTML = `
                    <span class="day-badge">${day.day}</span>
                    <span>${formattedDate} ${day.title}</span>
                `;
                dayGroup.appendChild(dayTitle);

                day.locations.forEach(location => {
                    const item = document.createElement('div');
                    item.className = `location-item type-${location.type}`;
                    item.dataset.locationId = location.id;

                    item.innerHTML = `
                        <div class="location-item-time">⏰ ${location.time}</div>
                        <div class="location-item-name">${location.name}</div>
                        <div class="location-item-desc">${location.description}</div>
                        ${location.price ? `<div class="location-item-time">💰 ${location.price}</div>` : ''}
                    `;

                    item.addEventListener('click', () => {
                        focusLocation(location.id);
                    });

                    dayGroup.appendChild(item);
                });

                itinerary.appendChild(dayGroup);
            });
        }

        // 添加所有標記
        function addAllMarkers(days) {
            days.forEach(day => {
                day.locations.forEach(location => {
                    const color = typeColors[location.type] || '#666';

                    // 創建自訂圖標
                    const icon = L.divIcon({
                        className: 'custom-marker',
                        html: `<div style="background-color: ${color}; width: 24px; height: 24px; border-radius: 50%; border: 3px solid white; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: white; box-shadow: 0 2px 8px rgba(0,0,0,0.3);">
                            ${location.id.substring(0, 1).toUpperCase()}
                        </div>`,
                        iconSize: [30, 30],
                        iconAnchor: [15, 15]
                    });

                    const marker = L.marker([location.lat, location.lng], { icon })
                        .bindPopup(`
                            <div style="font-family: sans-serif; min-width: 250px;">
                                <div class="popup-title">${location.name}</div>
                                <div class="popup-content">
                                    <p><strong>⏰ 時間：</strong> ${location.time}</p>
                                    <p><strong>📍 說明：</strong> ${location.description}</p>
                                    ${location.price ? `<p><strong>💰 費用：</strong> ${location.price}</p>` : ''}
                                    <p><strong>📅 日期：</strong> ${day.date}</p>
                                </div>
                            </div>
                        `)
                        .addTo(map);

                    markers[location.id] = { marker, location, dayDate: day.date };
                });
            });
        }

        // 聚焦到特定位置
        function focusLocation(locationId) {
            // 移除所有活躍標記
            document.querySelectorAll('.location-item.active').forEach(el => {
                el.classList.remove('active');
            });

            // 激活選中項目
            const items = document.querySelectorAll(`[data-location-id="${locationId}"]`);
            items.forEach(item => item.classList.add('active'));

            // 地圖居中並打開Popup
            if (markers[locationId]) {
                const { marker, location } = markers[locationId];
                map.setView([location.lat, location.lng], 13);
                marker.openPopup();

                // 滾動列表項目到視圖
                const item = document.querySelector(`[data-location-id="${locationId}"]`);
                if (item) {
                    item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }
        }

        // 篩選日期
        document.getElementById('dayFilter').addEventListener('change', (e) => {
            const filterDate = e.target.value;

            // 更新行程列表
            renderItinerary(allData.days, filterDate);

            // 隱藏/顯示標記
            Object.keys(markers).forEach(id => {
                const { marker, dayDate } = markers[id];
                if (filterDate === '') {
                    marker.setOpacity(1);
                } else if (dayDate === filterDate) {
                    marker.setOpacity(1);
                    if (currentMarkers.length === 0) {
                        // 第一次篇選時，居中到該日期的第一個位置
                        const firstLocation = allData.days.find(d => d.date === filterDate)?.locations[0];
                        if (firstLocation) {
                            map.setView([firstLocation.lat, firstLocation.lng], 12);
                        }
                    }
                } else {
                    marker.setOpacity(0.3);
                }
            });

            currentMarkers = filterDate ?
                Object.entries(markers)
                    .filter(([_, { dayDate }]) => dayDate === filterDate)
                    .map(([id]) => id)
                : [];
        });

        // 初始化
        initMap();
        loadData();
    </script>
</body>
</html>
